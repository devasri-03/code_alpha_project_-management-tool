<!DOCTYPE html>
<html>
<head>
    <title>Create Task</title>
</head>
<body>

<h1>Create Task</h1>

<form method="POST">
    {% csrf_token %}

    <label>Task Title</label>
    <br>
    <input type="text" name="title" required>

    <br><br>

    <label>Description</label>
    <br>
    <textarea name="description"></textarea>

    <br><br>

    <button type="submit">Create Task</button>
</form>

<br>

<a href="/project/{{ project.id }}/">
    Back to Project
</a>

</body>
</html>
